<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
  <title>TripMate AI — Travel Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="/" class="brand">
        <div class="brand-logo">✈️</div>
        <span class="brand-name">TripMate AI</span>
      </a>
      <div class="nav-actions">
        <button id="clearBtn" class="btn-ghost" title="Clear conversation">Clear</button>
      </div>
    </header>

    <main class="main">
      <section class="hero">
        <span class="hero-label">AI Travel Planner</span>
        <h1>Your personal travel assistant</h1>
        <p>Plan complete trips with flights, hotels, and custom itineraries — powered by AI agents.</p>
      </section>

      <div class="chat-card">
        <div class="chat-header">
          <div class="chat-title">
            <span class="chat-status"></span>
            Travel Planner
          </div>
        </div>

        <form id="chatForm" class="input-area">
          <textarea
            id="chatInput"
            class="textarea"
            placeholder="e.g., Plan a 7-day trip to Japan in May 2026..."
            rows="1"
            required
          ></textarea>
          <button id="submitBtn" type="submit" class="btn-primary">
            Plan Trip
          </button>
        </form>

        <div id="messages" class="messages-container">
          <div class="empty-state">
            <div class="empty-icon">🗺️</div>
            <div class="empty-title">Start planning your trip</div>
            <div class="empty-text">Tell us where you want to go</div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Powered by TripMate AI — <a href="/">Multi-Agent Travel Planner</a></p>
    </footer>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
